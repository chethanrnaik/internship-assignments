<!DOCTYPE html>
<html>
<head>
  <title>Complete Registration Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .container {
      width: 420px;
      background: #ffffff;
      padding: 20px;
      margin: 40px auto;
      border-radius: 8px;
    }

    h2 {
      text-align: center;
    }

    label {
      font-weight: bold;
      margin-top: 12px;
      display: block;
    }

    /* Red star for required fields */
    .required::after {
      content: " *";
      color: red;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }

    .inline {
      width: auto;
      margin-right: 6px;
    }

    .error {
      border: 2px solid red;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background: green;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    #message {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }

    /* Skills UI */
    .skills-box {
      margin-top: 8px;
    }

    .skill-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #e0e0e0;
      padding: 6px 10px;
      margin: 4px 0;
      border-radius: 4px;
    }

    .remove {
      color: red;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Registration Form</h2>

  <form onsubmit="validateForm(event)">

    <!-- NAME -->
    <label class="required">Full Name</label>
    <input type="text" id="name">

    <!-- EMAIL -->
    <label class="required">Email</label>
    <input type="email" id="email">

    <!-- PASSWORD -->
    <label class="required">Password</label>
    <input type="password" id="password">

    <label class="required">Confirm Password</label>
    <input type="password" id="confirm">

    <!-- GENDER -->
    <label class="required">Gender</label>
    <input type="radio" name="gender" class="inline"> Male
    <input type="radio" name="gender" class="inline"> Female
    <input type="radio" name="gender" class="inline"> Others

    <!-- ENGINEERING BRANCH -->
    <label class="required">Engineering Branch</label>
    <select id="branch">
      <option value="">-- Select Branch --</option>
      <option>Computer Science (CSE)</option>
      <option>Information Science (ISE)</option>
      <option>Electronics & Communication (ECE)</option>
      <option>Electrical & Electronics (EEE)</option>
      <option>Mechanical Engineering</option>
      <option>Civil Engineering</option>
      <option>Artificial Intelligence</option>
      <option>Data Science</option>
      <option>Cyber Security</option>
      <option>Robotics</option>
      <option>Biotechnology</option>
    </select>

    <!-- SKILLS -->
    <label>Skills</label>
    <select onchange="addSkill(this)">
      <option value="">-- Select Skill --</option>
      <option>HTML</option>
      <option>CSS</option>
      <option>JavaScript</option>
      <option>Python</option>
      <option>Java</option>
      <option>SQL</option>
    </select>

    <div class="skills-box" id="skillsList"></div>

    <!-- ABOUT -->
    <label class="required">About You</label>
    <textarea rows="3" id="about"></textarea>

    <!-- TERMS -->
    <input type="checkbox" id="agree" class="inline">
    <label class="required" style="display:inline;">I agree to the terms & conditions</label>

    <button type="submit">Register</button>

    <p id="message"></p>
  </form>
</div>

<script>
  function addSkill(select) {
    let skill = select.value;
    if (skill === "") return;

    let skillsList = document.getElementById("skillsList");

    if (skillsList.innerText.includes(skill)) {
      select.value = "";
      return;
    }

    let skillDiv = document.createElement("div");
    skillDiv.className = "skill-item";

    skillDiv.innerHTML = `
      <span>${skill}</span>
      <span class="remove" onclick="this.parentElement.remove()">✖</span>
    `;

    skillsList.appendChild(skillDiv);
    select.value = "";
  }

  function validateForm(event) {
    event.preventDefault();

    let isValid = true;
    let msg = document.getElementById("message");

    // clear errors
    document.querySelectorAll("input, select, textarea").forEach(el => {
      el.classList.remove("error");
    });

    let name = document.getElementById("name");
    let email = document.getElementById("email");
    let password = document.getElementById("password");
    let confirm = document.getElementById("confirm");
    let branch = document.getElementById("branch");
    let about = document.getElementById("about");
    let agree = document.getElementById("agree");
    let gender = document.querySelector('input[name="gender"]:checked');

    if (name.value.trim() === "") { name.classList.add("error"); isValid = false; }
    if (email.value.trim() === "") { email.classList.add("error"); isValid = false; }
    if (password.value === "") { password.classList.add("error"); isValid = false; }
    if (confirm.value === "") { confirm.classList.add("error"); isValid = false; }
    if (!gender) { isValid = false; }
    if (branch.value === "") { branch.classList.add("error"); isValid = false; }
    if (about.value.trim() === "") { about.classList.add("error"); isValid = false; }
    if (!agree.checked) { isValid = false; }

    if (password.value !== confirm.value) {
      password.classList.add("error");
      confirm.classList.add("error");
      msg.style.color = "red";
      msg.innerText = "Passwords do not match!";
      return;
    }

    if (!isValid) {
      msg.style.color = "red";
      msg.innerText = "Please fill all required fields marked with *";
      return;
    }

    msg.style.color = "green";
    msg.innerText = "Registration successful!";
  }
</script>

</body>
</html>
